[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pryecip-restaurant-local-connector"
version = "0.1.0"
description = "Pryecip Restaurant Local Connector for durable CUPS preparation delivery"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
cups = ["pycups>=2.0.4,<3"]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
pryecip-local-connector = "pryecip_local_connector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
