worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"correlation_id":"$request_id"}';
    access_log /dev/stdout json;
    error_log /dev/stderr warn;
    server_tokens off;
    client_max_body_size 2m;
    limit_req_zone $binary_remote_addr zone=public_entry:10m rate=10r/m;

    upstream api { server api:8000; keepalive 16; }
    upstream diner { server diner-web:8080; keepalive 8; }
    upstream staff { server staff-web:8080; keepalive 8; }

    server {
        listen 8080;
        server_name _;
        location = /health { access_log off; return 200 "ok\n"; }
        location / { return 308 https://$host$request_uri; }
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/tls.crt;
        ssl_certificate_key /run/tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = / { return 302 /staff/; }
        location = /health { proxy_pass http://api/health; }
        location = /ready { proxy_pass http://api/ready; }
        location = /metrics { return 404; }
        location ~ ^/(docs|redoc|openapi\.json) { return 404; }

        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $request_id;
            proxy_hide_header Server;
        }
        location = /api/auth/login { limit_req zone=public_entry burst=5 nodelay; proxy_pass http://api/auth/login; include /etc/nginx/proxy.conf; }
        location = /api/diner-sessions/join { limit_req zone=public_entry burst=10 nodelay; proxy_pass http://api/diner-sessions/join; include /etc/nginx/proxy.conf; }

        location = /diner { return 308 /diner/; }
        location /diner/ { proxy_pass http://diner/; include /etc/nginx/proxy.conf; }
        location = /staff { return 308 /staff/; }
        location /staff/ { proxy_pass http://staff/; include /etc/nginx/proxy.conf; }
    }
}
