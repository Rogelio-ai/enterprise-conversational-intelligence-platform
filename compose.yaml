services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --silent -h 127.0.0.1 -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build:
      context: ./apps/api
      target: development
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-ECIP API}
      APP_ENV: ${APP_ENV:-development}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-5}
      MYSQL_MAX_OVERFLOW: ${MYSQL_MAX_OVERFLOW:-10}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      AUTH_JWT_ALGORITHM: ${AUTH_JWT_ALGORITHM:-HS256}
      AUTH_ACCESS_TOKEN_TTL_MINUTES: ${AUTH_ACCESS_TOKEN_TTL_MINUTES:-60}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:create_app --factory --host "$${API_HOST}" --port "$${API_PORT}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"

volumes:
  mysql-data:
